name: mantenimiento

# Tareas puntuales que necesitan las credenciales, y por eso no se pueden
# ejecutar desde un portátil sin tener el token delante. Solo a mano.
on:
  workflow_dispatch:
    inputs:
      tarea:
        description: "Qué ejecutar"
        type: choice
        required: true
        options:
          - corregir-enlaces
          - diagnostico-meta
          - threads-user-id
          - conciliar
          - reels-estado
      dry_run:
        description: "Enseñar sin escribir"
        type: boolean
        default: true

jobs:
  mantenimiento:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet -r requirements.txt

      - name: Ejecutar
        env:
          SDB_PAGE_TOKEN:      ${{ secrets.SDB_PAGE_TOKEN }}
          SDB_PAGE_ID:         ${{ secrets.SDB_PAGE_ID }}
          SDB_THREADS_TOKEN:   ${{ secrets.SDB_THREADS_TOKEN }}
        run: |
          ARGS=""
          [ "${{ inputs.dry_run }}" = "true" ] && ARGS="--dry-run"
          case "${{ inputs.tarea }}" in
            corregir-enlaces) python3 scripts/corregir_enlaces.py $ARGS ;;
            # Solo lee. No publica nada y no imprime ningún token.
            diagnostico-meta) python3 scripts/diagnostico_meta.py ;;
            # El id de usuario de Threads no se puede consultar sin el token, y
            # el token vive aquí como secreto y no se puede leer desde fuera.
            # Preguntárselo a la API desde dentro del runner evita tener que
            # volver a generarlo y manejarlo a mano. El id NO es secreto: es
            # público en el perfil, así que imprimirlo en el log no expone nada.
            threads-user-id) python3 scripts/threads_user_id.py ;;
            # Compara el feed de la página con lo que el repo cree haber
            # publicado. Con --dry-run solo informa; sin él registra los ids que
            # Meta confirma. Nunca borra nada.
            # Solo lee: pregunta a Meta el estado real de cada reel.
            reels-estado) python3 scripts/reels_estado.py ;;
            conciliar) python3 scripts/conciliar.py $([ "${{ inputs.dry_run }}" = "true" ] || echo --escribir) ;;
            *) echo "tarea desconocida"; exit 1 ;;
          esac

      - name: Registrar el resultado
        if: ${{ inputs.dry_run == false }}
        run: |
          git config user.name  "sabiduria-bot"
          git config user.email "bot@users.noreply.github.com"
          git add content/
          git diff --staged --quiet || git commit -m "mantenimiento: ${{ inputs.tarea }}"
          # Mismo rebase que publicar.yml y hilos.yml: un push a secas lo rechaza
          # cualquier otro proceso que se adelante, y aquí se perdería el
          # resultado de la tarea sin que nadie se entere.
          git rebase --abort 2>/dev/null || true
          git checkout -- docs/feed.xml 2>/dev/null || true
          git pull --rebase --autostash origin main
          git push origin main
