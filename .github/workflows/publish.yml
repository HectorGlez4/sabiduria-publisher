name: publicar

# Las tres franjas, en hora de Ciudad de México (UTC-6).
# Los minutos NO son redondos a propósito: publicar siempre al mismo minuto es
# un patrón que los filtros de spam reconocen. El jitter fino lo aplica el
# campo publish_at de cada pieza; esto solo abre la ventana.
on:
  schedule:
    - cron: "12 14 * * *"   # 08:12 CDMX — mañana
    - cron: "07 19 * * *"   # 13:07 CDMX — tarde
    - cron: "38 01 * * *"   # 19:38 CDMX — noche (día anterior en CDMX)
  workflow_dispatch:
    inputs:
      id:
        description: "Publicar una pieza concreta (ej. 2026-08-18-tarde). Vacío = la vencida más antigua."
        required: false
      dry_run:
        description: "Generar y validar sin publicar"
        type: boolean
        default: false

concurrency:
  group: publicar
  cancel-in-progress: false   # nunca cancelar una publicación a medias

jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # para hacer commit del resultado
      issues: write            # para avisar si una publicación falla

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Las fuentes NO se instalan del sistema: van empaquetadas en
      # assets/fonts/. Aquí había un "apt-get install fonts-lora fonts-poppins"
      # con "|| true": ninguno de los dos paquetes existe en Ubuntu, así que el
      # paso salía en verde y la publicación reventaba después, al renderizar.
      - name: Instalar dependencias
        run: pip install --quiet -r requirements.txt

      # La identidad tiene que estar puesta ANTES de publicar, no despues: el
      # backend de hosting 'github' hace commit del PNG DENTRO del paso de
      # publicar, porque Meta descarga la imagen de raw.githubusercontent. Con
      # la identidad solo en el paso final, 'git commit' falla con "Author
      # identity unknown" y no se publica nada.
      # Ni el test ni el --dry-run cubren esto: el test sustituye upload_asset
      # por una lambda y el dry-run retorna antes de llegar al hosting.
      - name: Configurar git
        run: |
          git config user.name  "sabiduria-bot"
          git config user.email "bot@users.noreply.github.com"

      - name: Publicar
        env:
          SDB_PAGE_ID:          ${{ secrets.SDB_PAGE_ID }}
          SDB_PAGE_TOKEN:       ${{ secrets.SDB_PAGE_TOKEN }}
          SDB_IG_USER_ID:       ${{ secrets.SDB_IG_USER_ID }}
          SDB_THREADS_USER_ID:  ${{ secrets.SDB_THREADS_USER_ID }}
          SDB_THREADS_TOKEN:    ${{ secrets.SDB_THREADS_TOKEN }}
          R2_ACCOUNT_ID:        ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PUBLIC_BASE:       ${{ secrets.R2_PUBLIC_BASE }}
        run: |
          ARGS="--due"
          [ -n "${{ inputs.id }}" ] && ARGS="--id ${{ inputs.id }}"
          [ "${{ inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run"
          python3 -m src.publish $ARGS

      # Sin esto, un fallo un jueves se descubre mirando la página. Ahora que
      # publica sola tres veces al día, eso es demasiado tarde.
      # No salta cuando una pieza queda 'aplazada' por cadencia: eso sale con
      # código 0 a propósito, porque es funcionamiento normal y un aviso que
      # salta siempre es un aviso que se aprende a ignorar.
      - name: Avisar si falló
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          CUERPO="La ejecución de *publicar* falló.

          Registro: $RUN_URL

          Qué mirar, por orden:
          1. \`python3 scripts/revisar_bloqueadas.py\` — si una pieza quedó apartada, dice por qué
          2. Si el error es de credenciales, el token de página pudo invalidarse
          3. Si es de red o de Meta, la pieza se reintenta sola en la próxima ejecución (hasta 3 veces)

          Este aviso se cierra solo cuando una publicación vuelve a salir bien."
          EXISTE=$(gh issue list --label publicacion-fallida --state open --limit 1 --json number -q '.[0].number')
          if [ -n "$EXISTE" ]; then
            gh issue comment "$EXISTE" --body "$CUERPO"
          else
            gh label create publicacion-fallida --color B60205 --description "Fallo del publicador automático" 2>/dev/null || true
            gh issue create --title "Falló una publicación automática" --label publicacion-fallida --body "$CUERPO"
          fi

      # Si vuelve a publicar bien, se cierra el aviso: un aviso que se queda
      # abierto para siempre deja de significar nada.
      - name: Cerrar el aviso si ya salió bien
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for N in $(gh issue list --label publicacion-fallida --state open --json number -q '.[].number'); do
            gh issue close "$N" --comment "Una publicación posterior salió bien. Se cierra."
          done

      - name: Registrar el resultado
        if: always()
        run: |
          git add content/
          git diff --staged --quiet || git commit -m "publicado: $(date -u +%F' '%R) UTC"
          git push
