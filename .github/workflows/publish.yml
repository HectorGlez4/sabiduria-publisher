name: publicar

# Cada hora, y son las REGLAS las que deciden qué sale.
#
# Antes había tres disparos, uno por franja, a las 14:12 / 19:07 / 01:38 UTC.
# No funcionaba: el jitter de 5-50 minutos empuja las piezas más allá de su
# propio cron, y 37 de las 40 en cola tenían la hora DESPUÉS del disparo que
# debía recogerlas. Cada una esperaba al siguiente y salía una franja tarde, en
# cascada. La noche del 17 de agosto no se notó porque GitHub retrasó el cron
# una hora y la demora tapó el hueco; ese retraso va de minutos a una hora sin
# aviso, así que era una moneda al aire cada día.
#
# Con ejecución horaria, publish_at marca el "no antes de" y el control real lo
# llevan las reglas de cadencia de variants.py: máximo 3 al día en hora de CDMX
# y mínimo 4 horas entre publicaciones. Se autocorrige: si una ejecución falla o
# se retrasa, la siguiente entra en una hora, no en cinco.
#
# El minuto 23 no es redondo a propósito, y la demora natural de Actions añade
# la variación que antes buscaba el jitter.
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      id:
        description: "Publicar una pieza concreta (ej. 2026-08-18-tarde). Vacío = la vencida más antigua."
        required: false
      dry_run:
        description: "Generar y validar sin publicar"
        type: boolean
        default: false

concurrency:
  group: publicar
  cancel-in-progress: false   # nunca cancelar una publicación a medias

jobs:
  publicar:
    runs-on: ubuntu-latest
    # Con --max 12 el job espera 22 min entre piezas: hasta ~4,5 h de reloj más
    # lo que tarden las subidas. 330 min deja margen sobre eso y sigue por
    # debajo del límite de 6 h, así que un cuelgue en la subida de un reel no se
    # come el runner una jornada entera.
    timeout-minutes: 330
    permissions:
      contents: write          # para hacer commit del resultado
      issues: write            # para avisar si una publicación falla

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Las fuentes NO se instalan del sistema: van empaquetadas en
      # assets/fonts/. Aquí había un "apt-get install fonts-lora fonts-poppins"
      # con "|| true": ninguno de los dos paquetes existe en Ubuntu, así que el
      # paso salía en verde y la publicación reventaba después, al renderizar.
      # ffmpeg NO viene en ubuntu-latest y src/render/reel.py lo invoca por
      # subprocess. Sin esto el render del reel muere con
      # "FileNotFoundError: [Errno 2] ... 'ffmpeg'" y la pieza gasta un intento;
      # a los tres se aparta como 'blocked'. Pasó con 2026-08-26-re01-reel, que
      # falló dos veces antes de que nadie mirara. Sin "|| true": si el paquete
      # no está, esto tiene que ponerse rojo aquí y no reventar al renderizar.
      - name: Instalar ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Instalar dependencias
        run: pip install --quiet -r requirements.txt

      # Que ffmpeg exista y sepa hacer H.264, que es lo que pide Meta. Es una
      # línea y convierte un fallo de producción en un fallo de arranque.
      - name: Comprobar ffmpeg
        run: ffmpeg -hide_banner -encoders | grep -q libx264 && ffmpeg -version | head -1

      # La identidad tiene que estar puesta ANTES de publicar, no despues: el
      # backend de hosting 'github' hace commit del PNG DENTRO del paso de
      # publicar, porque Meta descarga la imagen de raw.githubusercontent. Con
      # la identidad solo en el paso final, 'git commit' falla con "Author
      # identity unknown" y no se publica nada.
      # Ni el test ni el --dry-run cubren esto: el test sustituye upload_asset
      # por una lambda y el dry-run retorna antes de llegar al hosting.
      - name: Configurar git
        run: |
          git config user.name  "sabiduria-bot"
          git config user.email "bot@users.noreply.github.com"

      - name: Publicar
        env:
          SDB_PAGE_ID:          ${{ secrets.SDB_PAGE_ID }}
          SDB_PAGE_TOKEN:       ${{ secrets.SDB_PAGE_TOKEN }}
          SDB_IG_USER_ID:       ${{ secrets.SDB_IG_USER_ID }}
          SDB_THREADS_USER_ID:  ${{ secrets.SDB_THREADS_USER_ID }}
          SDB_THREADS_TOKEN:    ${{ secrets.SDB_THREADS_TOKEN }}
          R2_ACCOUNT_ID:        ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PUBLIC_BASE:       ${{ secrets.R2_PUBLIC_BASE }}
        run: |
          # --max 12: las ejecuciones programadas de GitHub son best effort, y el
          # 27 de agosto se degradaron de una hora clavada a dos huecos seguidos
          # de más de diez horas. Con --max 6 y esperas de 22 min, una ejecución
          # cubre ~2 h de reloj; con doce cubre el día entero, que es el tope
          # diario de variants.MAX_POR_DIA. Así dos ejecuciones supervivientes
          # bastan para la jornada en vez de las veinticuatro que hacían falta.
          #
          # El bucle no salta la cadencia —cada pieza repasa el preflight con el
          # historial ya actualizado por la anterior—, solo aprovecha la
          # ejecución que sí ocurrió.
          ARGS="--due --max 12"
          [ -n "${{ inputs.id }}" ] && ARGS="--id ${{ inputs.id }}"
          [ "${{ inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run"
          python3 -m src.publish $ARGS

      # Sin esto, un fallo un jueves se descubre mirando la página. Ahora que
      # publica sola tres veces al día, eso es demasiado tarde.
      # No salta cuando una pieza queda 'aplazada' por cadencia: eso sale con
      # código 0 a propósito, porque es funcionamiento normal y un aviso que
      # salta siempre es un aviso que se aprende a ignorar.
      - name: Avisar si falló
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          CUERPO="La ejecución de *publicar* falló.

          Registro: $RUN_URL

          Qué mirar, por orden:
          1. \`python3 scripts/revisar_bloqueadas.py\` — si una pieza quedó apartada, dice por qué
          2. Si el error es de credenciales, el token de página pudo invalidarse
          3. Si es de red o de Meta, la pieza se reintenta sola en la próxima ejecución (hasta 3 veces)

          Este aviso se cierra solo cuando una publicación vuelve a salir bien."
          EXISTE=$(gh issue list --label publicacion-fallida --state open --limit 1 --json number -q '.[0].number')
          if [ -n "$EXISTE" ]; then
            gh issue comment "$EXISTE" --body "$CUERPO"
          else
            gh label create publicacion-fallida --color B60205 --description "Fallo del publicador automático" 2>/dev/null || true
            gh issue create --title "Falló una publicación automática" --label publicacion-fallida --body "$CUERPO"
          fi

      # Si vuelve a publicar bien, se cierra el aviso: un aviso que se queda
      # abierto para siempre deja de significar nada.
      - name: Cerrar el aviso si ya salió bien
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for N in $(gh issue list --label publicacion-fallida --state open --json number -q '.[].number'); do
            gh issue close "$N" --comment "Una publicación posterior salió bien. Se cierra."
          done

      - name: Registrar el resultado
        if: always()
        run: |
          git add content/
          git diff --staged --quiet || git commit -m "publicado: $(date -u +%F' '%R) UTC"
          # --rebase ANTES del push, como en hilos.yml. Sin esto, cualquier otro
          # push concurrente —el de hilos, el de la rutina de borradores, o el
          # mío desde el portátil— rechaza este con "fetch first" y SE PIERDE el
          # commit que registra la publicación. La pieza ya salió a Meta pero
          # sigue en la cola, así que la siguiente ejecución la vuelve a
          # publicar: un post duplicado que nadie ve venir.
          #
          # Pasó el 27 de agosto a las 20:46. Esa vez solo se perdió el PNG,
          # pero la misma carrera con una publicación dentro sí duplica.
          git pull --rebase origin main
          git push origin main
