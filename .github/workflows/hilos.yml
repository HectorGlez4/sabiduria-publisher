name: hilos

# Threads tiene su propio reloj y su propio carril.
#
# No va dentro de publicar.yml a propósito: la cadencia de variants.py cuenta
# UNIDADES y no plataformas, así que veinticuatro hilos al día se comerían los
# doce huecos diarios y no saldría ni una foto ni un reel. Threads es otra
# superficie, con otro público y otro ritmo nativo.
#
# Cada hora en el minuto 41, lejos del 23 de publicar.yml para no competir por
# los runners ni por el grupo de concurrencia.
on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:
    inputs:
      cuantos:
        description: "Cuántos hilos como máximo en esta ejecución"
        required: false
        default: "4"
      dry_run:
        description: "Enseñar sin publicar"
        type: boolean
        default: false

concurrency:
  group: hilos
  cancel-in-progress: false

jobs:
  hilos:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # 4 hilos con esperas de 55 min son ~3 h. Igual que en publicar.yml, el
    # trabajo por ejecución es la defensa contra un cron que se salta horas.
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet -r requirements.txt

      - name: Configurar git
        run: |
          git config user.name  "sabiduria-bot"
          git config user.email "bot@users.noreply.github.com"

      # El corpus del sitio, para que el carril tenga citas nuevas que enlazar a
      # su página. Se clona FUERA del workspace: dentro, git status del
      # publicador vería la carpeta como cambio y el paso final intentaría
      # comitear sin nada preparado. Solo citas y autores, sin historial.
      #
      # continue-on-error: si GitHub no puede clonar, el carril sigue con el
      # archivo y el paso sale en rojo — degradar sin avisar escondería el fallo.
      - name: Traer el corpus del sitio
        continue-on-error: true
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/HectorGlez4/hectorglez4.github.io.git "$RUNNER_TEMP/sitio"
          git -C "$RUNNER_TEMP/sitio" sparse-checkout set corpus/citas corpus/autores
          echo "SDB_SITIO_DIR=$RUNNER_TEMP/sitio" >> "$GITHUB_ENV"
          echo "citas: $(ls "$RUNNER_TEMP/sitio/corpus/citas" | wc -l)"

      - name: Publicar hilos
        env:
          SDB_THREADS_USER_ID: ${{ secrets.SDB_THREADS_USER_ID }}
          SDB_THREADS_TOKEN:   ${{ secrets.SDB_THREADS_TOKEN }}
        run: |
          ARGS="--max ${{ inputs.cuantos || '4' }}"
          [ "${{ inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run"
          # -u: sin búfer. En CI la salida no va a un terminal y Python la
          # acumula; si GitHub mata el job por timeout, lo acumulado se pierde
          # y el job muere sin log. El 13 de septiembre un job de hilos pasó
          # horas en este paso sin dejar una línea que dijera si dormía o
          # estaba colgado.
          python3 -u scripts/hilos.py $ARGS

      # hilos.py sube el registro de cada hilo en cuanto lo publica. Este paso
      # recoge lo que se haya quedado atrás — y "atrás" incluye los commits
      # hechos pero NO subidos, no solo los ficheros sin comitear.
      #
      # Mirar solo `git status` fue el fallo del 13 de septiembre: _registrar
      # comiteó cuatro hilos, cada pull falló, el árbol quedó limpio, este paso
      # vio "sin cambios" y salió. Los cuatro registros murieron con el runner.
      - name: Recoger lo que quede sin registrar
        if: always()
        run: |
          git fetch -q origin main
          SIN_COMITEAR="$(git status --porcelain -- content/)"
          SIN_SUBIR="$(git log --oneline origin/main..HEAD)"
          if [ -z "$SIN_COMITEAR$SIN_SUBIR" ]; then echo "sin cambios"; exit 0; fi
          echo "sin comitear:"; echo "$SIN_COMITEAR"
          echo "sin subir:";    echo "$SIN_SUBIR"
          git add content/published/
          [ -f content/hilos_sitio.json ] && git add content/hilos_sitio.json
          git diff --cached --quiet || git commit -m "hilos: $(date -u +'%F %H:%M UTC')"
          git rebase --abort 2>/dev/null || true
          git checkout -- docs/feed.xml 2>/dev/null || true
          git pull --rebase --autostash origin main
          git push origin HEAD:main
